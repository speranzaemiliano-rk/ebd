<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="EBD Consultores">
  <title>EBD Consultores</title>
  <desc>Las letras EBD en volumen, con una orbita obliqua girando a su alrededor.</desc>

  <defs>
    <linearGradient id="cara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/><stop offset="1" stop-color="#1A5FD0"/>
    </linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3E90"/><stop offset="1" stop-color="#07245E"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1A73E8" stop-opacity=".15"/>
      <stop offset=".32" stop-color="#1A73E8" stop-opacity=".85"/>
      <stop offset=".70" stop-color="#6BA8FF" stop-opacity=".80"/>
      <stop offset="1"   stop-color="#1A73E8" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="delante"><rect x="0" y="63" width="120" height="57"/></clipPath>
  </defs>

  <!-- Isotipo -->
  <g transform="translate(-10,-20)">
    <g transform="rotate(-24 60 60)">
      <ellipse cx="60" cy="60" rx="50" ry="21.5" fill="none"
               stroke="url(#aro)" stroke-width="3.2" opacity=".55"/>
    </g>
    <g font-family="Google Sans, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
       font-size="38" font-weight="800" letter-spacing="-1.4" text-anchor="middle">
      <g fill="url(#canto)">
        <text x="60.4" y="72.4">EBD</text><text x="60.8" y="72.8">EBD</text>
        <text x="61.2" y="73.2">EBD</text><text x="61.6" y="73.6">EBD</text>
        <text x="62.0" y="74.0">EBD</text><text x="62.4" y="74.4">EBD</text>
        <text x="62.8" y="74.8">EBD</text><text x="63.2" y="75.2">EBD</text>
        <text x="63.6" y="75.6">EBD</text><text x="64.0" y="76.0">EBD</text>
      </g>
      <text x="60" y="72" fill="url(#cara)">EBD</text>
    </g>
    <g transform="rotate(-24 60 60)" clip-path="url(#delante)">
      <ellipse cx="60" cy="60" rx="50" ry="21.5" fill="none"
               stroke="url(#aro)" stroke-width="3.2"/>
    </g>
  </g>

  <!-- Logotipo -->
  <text x="114" y="46"
        font-family="Google Sans, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="6" fill="#5F6368">CONSULTORES</text>
</svg>
